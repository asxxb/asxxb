name: Update Open Source Cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-cards.js"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

# Only one workflow at a time may push to main.
# Use this same block in your other workflows that commit to main.
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and push contribution cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Always start from the newest main and regenerate on top of it,
            # so there is never a merge conflict to resolve.
            git fetch origin main
            git reset --hard origin/main

            node scripts/generate-cards.js

            git add -A README.md assets/contributions

            if git diff --cached --quiet; then
              echo "No generated changes to commit."
              exit 0
            fi

            git commit -m "Update open-source contribution cards"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed (attempt $attempt), retrying..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "Could not push after 5 attempts."
          exit 1
