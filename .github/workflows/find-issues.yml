name: Find Issues

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

# Read-only: no pushes, no issues, no comments anywhere.
permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional LLM provider. Without a key you get heuristic estimates.
          NSCALE_SERVICE_TOKEN: ${{ secrets.NSCALE_SERVICE_TOKEN }}
        run: node scripts/find-issues.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: issue-report
          path: issue-report.md
          retention-days: 14
