<svg xmlns="http://www.w3.org/2000/svg" width="880" height="100" viewBox="0 0 880 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .body { fill: #2b2b2b; }
    .leg  { fill: #3d3d3d; }
    .wing { fill: #8fd3ff; opacity: .85; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #b0b0b0; }
      .leg  { fill: #8a8a8a; }
      .wing { fill: #a8dcff; }
    }
  </style>

  <!-- the whole fly follows a wavy path: right, then back left -->
  <g>
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"
      path="M20,55 q50,-45 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0
            q-50,40 -100,0 t-100,0 t-100,0 t-100,0 t-100,0 t-100,0 t-100,0 t-100,0"/>

    <!-- face the direction of travel -->
    <g>
      <animateTransform attributeName="transform" type="scale" dur="14s" repeatCount="indefinite"
        calcMode="discrete" keyTimes="0;0.5;1" values="1 1;-1 1;1 1"/>

      <!-- tiny buzzing jitter -->
      <g>
        <animateTransform attributeName="transform" type="translate" dur="0.35s" repeatCount="indefinite"
          values="0 0;1 -2;-1 1;1 1;0 0"/>

        <!-- sprite is 12x9 pixels, each pixel 3x3, centered on the origin -->
        <g transform="translate(-18,-13.5) scale(3)" shape-rendering="crispEdges">
          <!-- wings, flapping between two frames -->
          <g class="wing">
            <g>
              <animate attributeName="opacity" values="1;0" dur="0.12s" repeatCount="indefinite" calcMode="discrete"/>
              <rect x="6" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/>
              <rect x="5" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/>
              <rect x="4" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/>
              <rect x="2" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/>
            </g>
            <g opacity="0">
              <animate attributeName="opacity" values="0;1" dur="0.12s" repeatCount="indefinite" calcMode="discrete"/>
              <rect x="1" y="2" width="6" height="1"/>
              <rect x="2" y="1" width="3" height="1"/>
              <rect x="2" y="3" width="3" height="1"/>
            </g>
          </g>
          <!-- legs -->
          <g class="leg">
            <rect x="4" y="6" width="1" height="2"/>
            <rect x="6" y="6" width="1" height="2"/>
            <rect x="8" y="6" width="1" height="2"/>
          </g>
          <!-- body -->
          <g class="body">
            <rect x="1" y="4" width="5" height="2"/>
            <rect x="2" y="3" width="3" height="1"/>
            <rect x="2" y="6" width="3" height="1"/>
            <rect x="6" y="3" width="3" height="3"/>
            <rect x="9" y="3" width="3" height="3"/>
          </g>
          <!-- eye -->
          <rect x="10" y="3" width="2" height="2" fill="#e03030"/>
          <rect x="11" y="3" width="1" height="1" fill="#ffb3b3"/>
        </g>
      </g>
    </g>
  </g>
</svg>
